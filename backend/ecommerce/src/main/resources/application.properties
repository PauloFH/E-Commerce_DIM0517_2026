spring.application.name=ecommerce

#---
# Sem o profile postgres a API usa o armazenamento em memória e não abre conexão com banco.
spring.config.activate.on-profile=!postgres
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

#---
spring.config.activate.on-profile=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/kompraki
spring.datasource.username=kompraki
spring.datasource.password=kompraki
